<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos Andablo - Haz tu Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-custom py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="../img/logo.png" alt="Logo Tacos Andablo" height="40">
                    <span>Tacos Andablo</span>
                </a>
                <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">
                    <i class="fa-solid fa-bars fa-lg text-white"></i>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
                        <li class="nav-item"><a class="nav-link" href="promociones.html">Promociones</a></li>
                        <li class="nav-item"><a class="nav-link active" href="pedidos.html">Pedidos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">
                <section class="card-taco p-4 p-md-5">
                    <h1 class="text-center mb-3"> Realiza tu Pedido</h1>
                    <p class="text-center text-muted mb-4">Ingresa tus datos y nosotros te confirmamos al instante.</p>

                    <!-- Formulario Complejo -->
                    <form id="form-pedido" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre completo *</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                            <div class="invalid-feedback">Por favor escribe tu nombre.</div>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="telefono" class="form-label fw-bold">Teléfono celular *</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="10 dígitos" required>
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label for="tipo-entrega" class="form-label fw-bold">Tipo de servicio</label>
                                <select class="form-select" id="tipo-entrega">
                                    <option value="recoger">Pasar a recoger</option>
                                    <option value="domicilio">Servicio a domicilio</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-8 mb-3">
                                <label for="taco" class="form-label fw-bold">Elige tu especialidad *</label>
                                <select class="form-select" id="taco" required>
                                    <option value="" selected disabled>Selecciona una opción...</option>
                                    <option value="Tacos al Pastor">Tacos al Pastor</option>
                                    <option value="Tacos de Bistec">Tacos de Bistec</option>
                                    <option value="Tacos de Suadero">Tacos de Suadero</option>
                                    <option value="Tacos de Longaniza">Tacos de Longaniza</option>
                                    <option value="Combo Taquiza Familiar">Combo Taquiza Familiar</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4 mb-3">
                                <label for="cantidad" class="form-label fw-bold">Órdenes *</label>
                                <input type="number" class="form-control" id="cantidad" min="1" max="20" value="1"
                                    required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="notas" class="form-label fw-bold">Instrucciones o salsa (Opcional)</label>
                            <textarea class="form-control" id="notas" rows="3"
                                placeholder="Ej. Con mucha piña, salsa verde aparte y limones extra."></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-crunch btn-lg">
                                <i class="fa-solid fa-paper-plane me-2"></i>Confirmar Pedido
                            </button>
                        </div>
                    </form>

                    <!-- Contenedor donde JS inyectará el resumen en el DOM -->
                    <div id="resumen-pedido"></div>
                </section>
            </div>
        </div>
    </main>


    <footer>
        <div class="container text-center">
            <p class="mb-1"><strong>Tacos Andablo</strong> &copy; 2026 - Tradición y Sabor Taquero</p>
        </div>
    </footer>

    <!-- Librería SweetAlert2 para modales interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../js/script.js"></script>
</body>

</html>
